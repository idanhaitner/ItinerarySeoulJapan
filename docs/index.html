<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f0eb" />
  <meta name="description" content="Idan and Shahar's Korea + Japan trip — Aug 27–Sep 25, 2026. Timelines, bookings checklist, maps, and travel tools." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Idan &amp; Shahar’s Trip · Korea + Japan 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=10" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>
<body>
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-wash"></div>
    <div class="bg-grid"></div>
    <div class="bg-grain"></div>
  </div>

  <div class="app">
    <section class="masthead" id="masthead">
      <div class="masthead-stage">
        <img
          class="masthead-photo"
          src="assets/japan-hero.jpg"
          alt="Torii gates in Japan"
          width="2000"
          height="1335"
          decoding="async"
          fetchpriority="high"
        />
        <div class="masthead-scrim" aria-hidden="true"></div>
        <div class="masthead-frame" aria-hidden="true"></div>

        <div class="masthead-content">
          <div class="masthead-seal" aria-hidden="true">旅</div>
          <p class="masthead-kicker anim-fade">韓国 · 日本 · Summer 2026</p>
          <h1 class="masthead-title">
            <span class="masthead-names anim-title">Idan &amp; Shahar’s</span>
            <span class="masthead-trip anim-title delay-title">Trip</span>
          </h1>
          <p class="masthead-sub anim-fade delay-1">A twenty-eight day journey from Seoul’s neon alleys to Kyoto’s quiet temples</p>

          <div class="masthead-divider anim-line" aria-hidden="true"></div>

          <div class="masthead-route anim-fade delay-2" id="masthead-route"></div>

          <div class="masthead-stats anim-fade delay-3">
            <div><em id="stat-days">28</em><span>Days</span></div>
            <div><em id="stat-cities">7</em><span>Cities</span></div>
            <div><em id="stat-places">115</em><span>Places</span></div>
          </div>

          <button type="button" class="masthead-cta anim-fade delay-4" id="scroll-to-plan">
            <span>Explore the itinerary</span>
            <span class="cta-arrow" aria-hidden="true">↓</span>
          </button>
        </div>
      </div>
    </section>

    <header class="topbar" id="topbar">
      <div class="topbar-row">
        <div class="topbar-brand">
          <span class="brand-seal" aria-hidden="true">旅</span>
          <div>
            <p class="brand-name">Idan &amp; Shahar</p>
            <p class="brand-meta" id="brand-meta">Korea · Japan · 2026</p>
          </div>
        </div>
        <nav class="tabs" aria-label="Main sections">
          <button type="button" class="tab active" data-nav="itinerary">Itinerary</button>
          <button type="button" class="tab" data-nav="bookings">Bookings</button>
          <button type="button" class="tab" data-nav="maps">Maps</button>
          <button type="button" class="tab" data-nav="tools">Tools</button>
        </nav>
      </div>

      <div class="topbar-filters" id="topbar-filters">
        <label class="search" for="search-input">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.5"/>
            <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="sr-only">Search</span>
          <input id="search-input" type="search" placeholder="Search days, places, food…" autocomplete="off" enterkeyhint="search" />
        </label>
        <div id="result-count" class="result-count" aria-live="polite">—</div>
      </div>

      <div id="city-chips" class="city-row" aria-label="Filter by city"></div>
    </header>

    <div id="day-ribbon" class="day-rail" aria-label="Jump to day" hidden></div>

    <main class="main">
      <section id="panel-itinerary" class="panel active" aria-label="Day by day">
        <div class="plan-intro" id="plan-intro">
          <p class="plan-kicker">The itinerary · 旅程</p>
          <h2 class="plan-title">Day by day</h2>
        </div>
        <div id="day-list" class="day-list"></div>
      </section>

      <section id="panel-bookings" class="panel" aria-label="Booking checklist" hidden>
        <div id="bookings-root"></div>
      </section>

      <section id="panel-maps" class="panel" aria-label="Places and maps" hidden>
        <div id="place-list" class="place-list"></div>
      </section>

      <section id="panel-tools" class="panel" aria-label="Travel tools" hidden>
        <div id="tools-root"></div>
      </section>

      <section id="panel-detail" class="panel" aria-label="Day detail" hidden>
        <div id="detail-root"></div>
      </section>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="Primary mobile">
    <button type="button" data-nav="itinerary" class="active"><span>Plan</span></button>
    <button type="button" data-nav="bookings"><span>Book</span></button>
    <button type="button" data-nav="maps"><span>Maps</span></button>
    <button type="button" data-nav="tools"><span>Tools</span></button>
  </nav>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/checklist.js"></script>
  <script src="js/tools.js?v=6"></script>
  <script src="js/journey-map.js?v=10"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
