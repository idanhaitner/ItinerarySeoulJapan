<!DOCTYPE html>
<html lang="he" dir="rtl" class="gate-locked">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12161e" />
  <meta name="description" content="הטיול של עידן ושחר לקוריאה ויפן — 27 באוגוסט עד 25 בספטמבר 2026. לוחות זמנים, הזמנות, מפות וכלים." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>הטיול של עידן ושחר · קוריאה + יפן 2026</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&family=Shippori+Mincho:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=92" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>
<body>
  <div id="access-gate" class="access-gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
    <div class="gate-bg" aria-hidden="true">
      <div class="gate-wash"></div>
      <div class="gate-rings"></div>
      <div class="gate-grain"></div>
    </div>
    <div class="gate-panel">
      <div class="gate-seal" aria-hidden="true"><span>旅</span></div>
      <p class="gate-kicker">קוריאה · יפן · 2026</p>
      <h1 id="gate-title" class="gate-title">הטיול של עידן ושחר</h1>
      <p class="gate-sub" data-gate-msg>הזינו את קוד הגישה</p>
      <div class="gate-dots" data-gate-dots aria-hidden="true"></div>
      <div class="gate-pad" data-gate-pad>
        <button type="button" data-digit="1">1</button>
        <button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button>
        <button type="button" data-digit="4">4</button>
        <button type="button" data-digit="5">5</button>
        <button type="button" data-digit="6">6</button>
        <button type="button" data-digit="7">7</button>
        <button type="button" data-digit="8">8</button>
        <button type="button" data-digit="9">9</button>
        <button type="button" class="gate-pad-ghost" disabled aria-hidden="true"></button>
        <button type="button" data-digit="0">0</button>
        <button type="button" data-action="del" aria-label="מחיקה">⌫</button>
      </div>
      <div class="gate-success" aria-hidden="true">
        <span class="gate-check">✓</span>
        <span>ברוכים הבאים</span>
      </div>
    </div>
  </div>
  <script src="js/gate.js?v=71"></script>

  <div class="bg-layer" aria-hidden="true">
    <div class="bg-wash"></div>
    <div class="bg-grid"></div>
    <div class="bg-grain"></div>
  </div>

  <div class="app">
    <section class="masthead" id="masthead">
      <div class="masthead-stage">
        <img
          class="masthead-photo"
          src="assets/japan-hero.jpg"
          alt="שערי טוריאי ביפן"
          width="2000"
          height="1335"
          decoding="async"
          fetchpriority="high"
        />
        <div class="masthead-scrim" aria-hidden="true"></div>
        <div class="masthead-glow" aria-hidden="true"></div>
        <div class="masthead-frame" aria-hidden="true"></div>

        <div class="masthead-content">
          <div class="masthead-seal" aria-hidden="true"><span>旅</span></div>
          <p class="masthead-kicker anim-kicker">קוריאה · יפן · קיץ 2026</p>
          <h1 class="masthead-title">
            <span class="masthead-names"><span class="title-clip"><span class="anim-title">הטיול של עידן ושחר</span></span></span>
            <span class="masthead-trip"><span class="title-clip"><span class="anim-title delay-title">קוריאה ויפן</span></span></span>
          </h1>

          <div class="masthead-divider anim-line" aria-hidden="true"></div>

          <div class="masthead-route" id="masthead-route"></div>

          <div class="masthead-stats">
            <div class="anim-stat delay-stat-1"><em id="stat-days">0</em><span>ימים</span></div>
            <div class="anim-stat delay-stat-2"><em id="stat-cities">0</em><span>ערים</span></div>
            <div class="anim-stat delay-stat-3"><em id="stat-places">0</em><span>מקומות</span></div>
          </div>

          <button type="button" class="masthead-cta anim-cta" id="scroll-to-plan">
            <span>לתוכנית הטיול</span>
            <span class="cta-arrow" aria-hidden="true">↓</span>
          </button>
        </div>
      </div>
    </section>

    <a class="skip-link" href="#main-content">דלגו לתוכן</a>

    <header class="topbar" id="topbar">
      <div class="topbar-chrome">
        <div class="topbar-brand">
          <span class="brand-seal" aria-hidden="true">旅</span>
          <div class="brand-copy">
            <p class="brand-name">עידן ושחר</p>
            <p class="brand-meta" id="brand-meta">קוריאה · יפן · תאילנד · 2026</p>
          </div>
        </div>
        <nav class="tabs" aria-label="ניווט ראשי">
          <button type="button" class="tab active" data-nav="itinerary" aria-current="page">מסלול</button>
          <button type="button" class="tab" data-nav="flights">טיסות</button>
          <button type="button" class="tab" data-nav="bookings">הזמנות</button>
          <button type="button" class="tab" data-nav="maps">מפות</button>
          <button type="button" class="tab" data-nav="recs">המלצות</button>
          <button type="button" class="tab" data-nav="tools">כלים</button>
        </nav>
      </div>

      <div class="topbar-filters" id="topbar-filters">
        <label class="search" for="search-input">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.5"/>
            <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="sr-only">חיפוש</span>
          <input id="search-input" type="search" placeholder="חיפוש ימים, מקומות, המלצות…" autocomplete="off" enterkeyhint="search" />
        </label>
        <div id="result-count" class="result-count" aria-live="polite">—</div>
      </div>

      <div id="city-chips" class="city-row" aria-label="סינון לפי עיר"></div>
    </header>

    <div id="day-ribbon" class="day-rail" aria-label="קפיצה ליום" hidden></div>

    <main class="main" id="main-content">
      <section id="panel-itinerary" class="panel active" aria-label="יום אחר יום">
        <div class="plan-intro" id="plan-intro">
          <p class="plan-kicker">המסלול · 旅程</p>
          <h2 class="plan-title">יום אחר יום</h2>
        </div>
        <div id="dest-intel" class="dest-intel" aria-live="polite"></div>
        <div id="day-list" class="day-list"></div>
      </section>

      <section id="panel-flights" class="panel" aria-label="טיסות" hidden>
        <div id="flights-root"></div>
      </section>

      <section id="panel-bookings" class="panel" aria-label="רשימת הזמנות" hidden>
        <div id="bookings-root"></div>
      </section>

      <section id="panel-maps" class="panel" aria-label="מקומות ומפות" hidden>
        <div id="place-list" class="place-list"></div>
      </section>

      <section id="panel-recs" class="panel" aria-label="המלצות" hidden>
        <div id="recs-root"></div>
      </section>

      <section id="panel-tools" class="panel" aria-label="כלי טיול" hidden>
        <div id="tools-root"></div>
      </section>

      <section id="panel-detail" class="panel" aria-label="פרטי יום" hidden>
        <div id="detail-root"></div>
      </section>
    </main>
  </div>

  <nav class="mobile-nav" aria-label="ניווט מובייל">
    <button type="button" data-nav="itinerary" class="active" aria-current="page"><span>מסלול</span></button>
    <button type="button" data-nav="flights"><span>טיסות</span></button>
    <button type="button" data-nav="bookings"><span>הזמנות</span></button>
    <button type="button" data-nav="maps"><span>מפות</span></button>
    <button type="button" data-nav="recs"><span>המלצות</span></button>
    <button type="button" data-nav="tools"><span>כלים</span></button>
  </nav>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/data.js?v=86"></script>
  <script src="js/he-data.js?v=88"></script>
  <script src="js/cafes.js?v=70"></script>
  <script src="js/storage.js"></script>
  <script src="js/checklist.js?v=83"></script>
  <script src="js/tools.js?v=71"></script>
  <script src="js/dest-intel.js?v=72"></script>
  <script src="js/journey-map.js?v=74"></script>
  <script src="js/recommendations.js?v=70"></script>
  <script src="js/app.js?v=87"></script>
</body>
</html>
